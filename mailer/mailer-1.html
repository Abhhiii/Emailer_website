    <script>
        function changeText() {
            const button = document.getElementById('myCheckbox');
            const dataContainer = document.getElementById('data-container');
            const selectoptiondiv = document.getElementById('selectoptiondiv');
            const tablesection = document.getElementById("table-section"); // Get the textarea element
            tablesection.style.display = 'none';

            if (button.checked) {
                // Checkbox is checked
            } else {
                // Checkbox is unchecked

                location.reload();
            }



            // Add an event listener to the button

            dataContainer.style.display = 'block';
            selectoptiondiv.style.display = 'none';
            // Show the container
            const elements123 = document.getElementsByClassName("position-fixed");

            // Loop through the elements and apply the margin-top with !important
            for (let i = 0; i < elements123.length; i++) {
                elements123[i].style.setProperty("margin-top", "81px", "important");
            }
        }
        // --- helper: get human-friendly selected display (prefer label -> option -> localStorage -> id)
        function getSelectedDisplayText() {
            const label = document.getElementById('selectedLabel') || document.getElementById('selected');
            if (label && label.innerText && String(label.innerText).trim() !== 'Select a track') {
                return String(label.innerText).trim();
            }
            const sel = document.getElementById('trackSelect');
            if (sel) {
                const opt = sel.options[sel.selectedIndex];
                if (opt && opt.textContent) return String(opt.textContent).trim();
            }
            try {
                const raw = localStorage.getItem('selectedValue');
                const parsed = raw ? JSON.parse(raw) : null;
                if (parsed) return String(parsed).trim();
            } catch (e) {}
            try {
                const rawId = localStorage.getItem('selectedId');
                const parsedId = rawId ? JSON.parse(rawId) : null;
                if (parsedId) return String(parsedId).trim();
            } catch (e) {}
            return '';
        }


        function getdata() {
            const textarea = document.getElementById("my-textarea"); // Get the textarea element
            const value = textarea.value; // Retrieve the value of the textarea
            const loadercontainer = document.getElementById("loadercontainer"); // Get the textarea element
            loadercontainer.style.display = 'block';
            const data = "Textarea Value: " + value;



            // alert(`${data}`)
            const lines = data.trim().split('\n');

            // Extract the "Class-Driver" from each line
            const classDriverPairs = lines.map(line => {
                // Match the Class-Driver pattern (e.g., "A/ED Clint Neff")
                const match = line.match(/([A-Z0-9\/]+)\s+([A-Za-z\s]+),/);
                if (match) {
                    return `${match[1]} ${match[2]}`; // Return the Class and Driver name
                }
                return null; // Return null if no match is found
            }).filter(Boolean); // Filter out null values

            // Output the classDriverPairs

            // Check if array is empty
            // console.log("Check if array is empty", classDriverPairs)
            if (classDriverPairs.length === 0) {
                const loadercontainer1 = document.getElementById("loadercontainer"); // Get the textarea element
                loadercontainer1.style.display = 'none';
                const popup = document.getElementById('popup-req-message1');
                popup.style.display = 'block';
                setTimeout(() => {
                    popup.style.display = 'none';
                    popup.style.backgroundColor = 'red';
                }, 2000);
            }

            function getDriverData(name, className, trackId) {
                const url = 'http://127.0.0.1:8000/api/driver-list/';
                const params = {
                    name: name,
                    class: className,
                    track_id: trackId
                };

                // Send the GET request
                axios.get(url, {
                        params
                    })
                    .then(response => {
                        loadercontainer.style.display = 'none';

                        // alert('success')
                        location.reload();
                        dataContainer.style.display = 'none';

                        // console.log("Driver data:", response.data);
                    })
                    .catch(error => {
                        loadercontainer.style.display = 'none';

                        // const popup = document.getElementById('popup-req-message1');
                        //         popup.style.display = 'block';
                        //         setTimeout(() => {
                        //             popup.style.display = 'none';
                        //             popup.style.backgroundColor = 'red';
                        //         },2000);
                        console.error("Error fetching data:", error); // Handle errors
                    });
            }
            classDriverPairs.forEach(driver => {
                // Split the driver string into Class and Driver parts
                const [className, ...nameParts] = driver.split(' '); // Split the string into parts by space; 'className' gets the first part
                const name = nameParts.join(' '); // Join the remaining parts to form the full name

                // console.log("Class: " + className); // Log the Class
                // console.log("Name: " + name); // Log the Name

                const selectId = JSON.parse(localStorage.getItem("selectedId"));

                // Pass the driver data to the function (trackId could be a fixed value or dynamic)
                const trackId = selectId; // Use a constant or dynamic value for the track ID
                getDriverData(name, className, trackId); // Ensure you're passing name and className in the correct order
            });
        }
    </script>

        document.addEventListener('DOMContentLoaded', function() {
            const selectElement = document.getElementById('trackSelect'); // Get the <select> element
            const apiUrl = 'tracks/'; // tracks endpoint
            const driversUrl = 'new-driver-list/'; // drivers endpoint (only for existence check)

            // helper to select placeholder in a Firefox-safe way
            function selectPlaceholder(selectEl) {
                const placeholder = Array.from(selectEl.options).find(o => String(o.value).trim() === '');
                if (placeholder) {
                    const wasDisabled = placeholder.disabled;
                    placeholder.disabled = false;
                    placeholder.selected = true;
                    selectEl.selectedIndex = Array.from(selectEl.options).indexOf(placeholder);
                    setTimeout(() => {
                        placeholder.disabled = wasDisabled;
                    }, 0);
                } else {
                    selectEl.selectedIndex = 0;
                }
                selectEl.disabled = false;
                const selectedLabel = document.getElementById('selected') || document.getElementById('selectedLabel');
                if (selectedLabel) selectedLabel.innerText = 'Select a track';
            }

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    // populate select options (value only id, text friendly)
                    data.forEach(track => {
                        const option = document.createElement('option');
                        option.className = "option1";
                        option.value = String(track.id);
                        option.textContent = track.altitude != null ? `${track.track_name} (${track.altitude} ft)` : track.track_name;
                        option.dataset.name = track.track_name || '';
                        option.dataset.altitude = track.altitude != null ? String(track.altitude) : '';
                        selectElement.appendChild(option);
                    });

                    // Now check whether drivers exist (we only need length here)
                    return fetch(driversUrl).then(r => r.json());
                })
                .then(driversData => {
                    // driversData may be an array — if there are drivers -> restore saved selection; else clear
                    const driversExist = Array.isArray(driversData) && driversData.length > 0;

                    try {
                        const savedRaw = localStorage.getItem('selectedId');
                        const savedId = savedRaw ? JSON.parse(savedRaw) : null;

                        if (driversExist && savedId !== null && String(savedId).trim() !== '') {
                            const target = String(savedId).trim();
                            const opt = Array.from(selectElement.options).find(o => String(o.value).trim() === target);
                            if (opt) {
                                selectElement.value = target;
                                opt.selected = true;
                                const displayText = opt.textContent ? String(opt.textContent).trim() : '';
                                const selectedLabel = document.getElementById('selected') || document.getElementById('selectedLabel');
                                if (selectedLabel) selectedLabel.innerText = displayText;
                                // keep storage in sync
                                localStorage.setItem('selectedId', JSON.stringify(String(target)));
                                localStorage.setItem('selectedValue', JSON.stringify(displayText));
                                // disable select because drivers exist (same as your prior behavior)
                                selectElement.disabled = true;
                                // NOTE: don't call updateTable here — your existing code (window.onload block) will render table as before
                            } else {
                                // saved id not found — clear and show placeholder
                                localStorage.removeItem('selectedId');
                                localStorage.removeItem('selectedValue');
                                selectPlaceholder(selectElement);
                            }
                        } else {
                            // no drivers -> clear saved and show placeholder
                            localStorage.removeItem('selectedId');
                            localStorage.removeItem('selectedValue');
                            selectPlaceholder(selectElement);
                        }
                    } catch (err) {
                        console.error('Error restoring selection:', err);
                        localStorage.removeItem('selectedId');
                        localStorage.removeItem('selectedValue');
                        selectPlaceholder(selectElement);
                    }
                })
                .catch(error => {
                    console.error('Error fetching track or driver data:', error);
                    // fallback: if tracks fetched but drivers fetch failed, just leave select enabled
                    // (do not restore selection blindly)
                    selectElement.disabled = false;
                });
        });
