    <script>
        function copyToClipboard(){
            const tableRows = document.querySelectorAll('.table-data-row');
            const trackData = document.querySelector('#selected')
            const selectValue = JSON.parse(localStorage.getItem("selectedValue"))
            const date = Date().split(" ");
            const date1 = date[1]+ " "+ date[2]+" "+date[3];
            // console.log(selectValue)
            const data = [];
            let obj ={};
            const body = encodeURIComponent(Array.from(tableRows).map(row => {
                const lic = row.querySelector('td:nth-child(1)').textContent;
                const name = row.querySelector('td:nth-child(2)').textContent;
                const driverClass = row.querySelector('td:nth-child(3)').textContent;
                const personalIndex = row.querySelector('td:nth-child(4)').textContent;
                obj={
                    lic ,
                    name,
                    driverClass,
                    personalIndex,
                }
                data.push(obj)
                return `Lic# : ${lic}\nName: ${name}\nClass: ${driverClass}\nIndex: ${personalIndex}\n\n`;
            }).join('\n'));
            let str= [];
            let data1 =[]
            data1.push(selectValue)
            data1.push(date1)
            let result = data.map(i =>{
                str[i]= i.lic + " " +i.name+ " "+ i.driverClass + "  "+ i.personalIndex;
                data1.push(str[i])
            })
            // console.log(data1.join('\n'))
            
            navigator.clipboard.writeText(data1.join('\n')).then(()=>{
                const popup = document.getElementById('popup-message');
                popup.style.display = 'block';
                setTimeout(() => {
                    popup.style.display = 'none';
                }, 2000);
            }).catch((err)=>{
                // console.log(err)
            })
        }

        document.addEventListener('DOMContentLoaded', function () {

            function updateTable(data) {
                data.forEach((value) => {
                    

                    const deleteBtnImg = "{% static 'images/trash-02.svg' %}"
                    const piImgBtn = "{% static 'images/Group-904.svg' %}"

                    const trow = document.createElement('tr');
                    trow.className = 'table-data-row';

                    const tdata2= document.createElement('td');
                    const tdata4 = document.createElement('td');
                    const tdata3 = document.createElement('td');
                    const tdata5 = document.createElement('td');
                    const tdata6 = document.createElement('td');
                    const deleteImg = document.createElement('img');
                    const piImg = document.createElement('img');
                    const deleteBtn = document.createElement('button');
                    tdata6.appendChild(deleteBtn);
                    // tdata1.innerHTML = value.lic;
                    tdata2.innerHTML = value.driver;
                    tdata3.innerHTML = value.classes;
                    // tdata5.innerHTML = value.updated_index +" "+ `(${value.index})`;
                    if (value.updated_index!=0.0){
                        tdata5.innerHTML = value.updated_index +" "+ `(${value.index})`;
                        // console.log("ok3",tdata5)
                        
                    }else{
                        tdata5.innerHTML = value.index;
                        // console.log("ok",value.index)

                }
                    deleteBtn.className = 'mybtn2';
                    deleteBtn.onclick = (trow) => {
                        const csrfToken = "{{ csrf_token }}";
                        let id = value.id;
                        fetch(`new-driver-list/${id}/`, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrfToken,
                        },
                    })
                    setTimeout(() => {
                        window.location.reload();
                    }, 100)

                    }
                    deleteImg.src = deleteBtnImg;
                    piImg.src = piImgBtn;

                    deleteBtn.appendChild(deleteImg);
                    // trow.appendChild(tdata1);
                    trow.appendChild(tdata2);
                    trow.appendChild(tdata3);
                    trow.appendChild(tdata4);
                    trow.appendChild(tdata5);
                    trow.appendChild(tdata6);
                    tableBody.appendChild(trow);
                })
            }

            //select operation
            let selectedValue = "";
        const selectTeg = document.getElementById('trackSelect');
        // console.log(selectTeg)
       
              selectTeg.addEventListener('change', (e) => {
            //   console.log(e.target.value.substring(4))
              selectedValue = e.target.value;
              localStorage.setItem("selectedValue", JSON.stringify(selectedValue.substring(3)));
              localStorage.setItem("selectedId", JSON.stringify(selectedValue.substring(0, selectedValue.indexOf(' '))));

            //   console.log("tag ==> ", selectedValue.substring(0, selectedValue.indexOf(' '))[1])

            
           })

            const selectId = JSON.parse(localStorage.getItem("selectedId"))

            window.onload = () => {

                } else {

                    localStorage.clear('selectedId');

                            localStorage.clear('selectedValue');

                    .catch(err => {
                        // console.log('Error fetching data:',err);
                    });
                

            
            }

             

            function fetchAndUpdateTable(e) {
                // console.log(e)
                const nameValue = nameInput.value.trim();
                const classValue = classInput.value.trim();
                const selectId = JSON.parse(localStorage.getItem("selectedId"))

                // console.log("selectedValue", selectedValue)


                if (nameValue && classValue) {
                    fetch(`api/driver-list/?track_id=${Number(selectId)}&name=${encodeURIComponent(nameValue)}&class=${encodeURIComponent(classValue)}`)

                    setTimeout(() => {
                        window.location.reload();
                    }, 100)
                    
                } else {
                    // console.log("Please enter both name and class values.");
                }
                if(!nameValue || !classValue || !selectId){
                    // console.log("fields are req")
                    const popup = document.getElementById('popup-req-message');
                    popup.style.display = 'block';
                    setTimeout(() => {
                        popup.style.display = 'none';
                        popup.style.backgroundColor = 'red';
                    },2000);}
            }

            submitButton.addEventListener('click', function (event) {
                event.preventDefault();
                fetchAndUpdateTable();
            });
            nameInput.addEventListener('input', function () {
                const query = nameInput.value;
                // console.log(localStorage.getItem('selectedId')) 
                // const selectValue = JSON.parse(localStorage.getItem("selectedValue"))
                const selectId = JSON.parse(localStorage.getItem("selectedId"))
                // console.log(selectValue)
                fetch(`api/driver-list/?track_id=${Number(selectId)}&name=${query}`)

                    .then(data => {
                        nameSuggestions.innerHTML = '';
                        classSuggestions.innerHTML = '';

                        data.name_suggestions.forEach(nameSuggestion => {
                            const suggestion = document.createElement('option');
                            suggestion.value = nameSuggestion;
                            nameSuggestions.appendChild(suggestion);
                        });

                        data.class_suggestions.forEach(classSuggestion => {
                            const suggestion = document.createElement('option');
                            suggestion.value = classSuggestion;
                            classSuggestions.appendChild(suggestion);
                        });
                        
                    });
            });

        });

        document.addEventListener('DOMContentLoaded', function() {
    const selectElement =document.getElementById('trackSelect'); // Get the <select> element
    const apiUrl = 'tracks/'; // Your API endpoint URL

    fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
            // Iterate through each track from the API response
            data.forEach(track => {
                const option = document.createElement('option');
                option.className = "option1"

                if (track.altitude !== null) {
                    // If altitude is not null, display track name with altitude
                    option.value = `${track.id} ${track.track_name} ${track.altitude}`;
                    option.textContent = `${track.track_name} (${track.altitude} ft)`;
                    // option.id = `${track.id})`;
                } else {
                    // If altitude is null, display only track name
                    option.value = `${track.id} ${track.track_name}`;
                    option.textContent = track.track_name;
                    // option.id = `${track.id})`;
                }

                selectElement.appendChild(option);
                
            });
        })
        .catch(error => {
            console.error('Error fetching track data:', error);
        });

       
});
